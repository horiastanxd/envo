[package]
name = "envo-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Typed .env manager: schema with types, profile inheritance, secret-leak detection, and encryption at rest."
license = "MIT"
repository = "https://github.com/horiastanxd/envo"
homepage = "https://github.com/horiastanxd/envo"
documentation = "https://github.com/horiastanxd/envo"
readme = "README.md"
keywords = ["dotenv", "env", "secrets", "cli", "config"]
categories = ["command-line-utilities", "development-tools", "config"]
exclude = ["/.github", "/npm", "/dist", "/scripts"]

[[bin]]
name = "envo"
path = "src/main.rs"

[lib]
name = "envo"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
regex = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
