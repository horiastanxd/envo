name: Bug report
description: A wrong validation, a missed secret, a crypto problem, or a crash.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did envo do, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Command run, relevant `.envo` / `.env*` files (redact real secrets!), and the output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `envo --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: e.g. macOS 14 arm64, Ubuntu 24.04 x64
    validations:
      required: true
